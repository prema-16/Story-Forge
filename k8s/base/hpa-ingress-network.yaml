apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storyforge-backend-hpa
  namespace: storyforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storyforge-backend
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storyforge-frontend-hpa
  namespace: storyforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storyforge-frontend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storyforge-ingress
  namespace: storyforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.storyforge.ai
        - app.storyforge.ai
      secretName: storyforge-tls
  rules:
    - host: api.storyforge.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storyforge-backend
                port:
                  number: 5000
    - host: app.storyforge.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storyforge-frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storyforge-network-policy
  namespace: storyforge
spec:
  podSelector:
    matchLabels:
      app: storyforge-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: storyforge
      ports:
        - protocol: TCP
          port: 27017   # MongoDB
        - protocol: TCP
          port: 6379    # Redis
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443     # External HTTPS (AI providers, Cloudinary, etc.)
