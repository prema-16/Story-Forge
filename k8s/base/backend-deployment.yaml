apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyforge-backend
  namespace: storyforge
  labels:
    app: storyforge-backend
    version: "3.0.0"
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storyforge-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: storyforge-backend
        version: "3.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/platform/observability/metrics/prometheus"
        prometheus.io/port: "5000"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - storyforge-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: ghcr.io/storyforge/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
          envFrom:
            - secretRef:
                name: storyforge-backend-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: storyforge-backend
  namespace: storyforge
spec:
  selector:
    app: storyforge-backend
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
