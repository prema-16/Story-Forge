services:
  # ─── FRONTEND NEXT.JS SERVICE ──────────────────────────────────────────────
  - type: web
    name: storyforge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: storyforge-backend
          property: url

  # ─── BACKEND EXPRESS API SERVICE ───────────────────────────────────────────
  - type: web
    name: storyforge-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
