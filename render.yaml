services:
  # ─── FRONTEND NEXT.JS SERVICE ──────────────────────────────────────────────
  - type: web
    name: storyforge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: storyforge-backend
          property: url

  # ─── BACKEND EXPRESS API SERVICE ───────────────────────────────────────────
  # NOTE: rootDir is intentionally NOT set here.
  # The backend depends on @storyforge/shared (packages/shared), which lives
  # outside the backend/ folder. We must install & build from the repo root
  # so that the workspace symlink resolves correctly at runtime.
  - type: web
    name: storyforge-backend
    runtime: node
    buildCommand: npm install && npm run build --prefix packages/shared && npm run build --prefix backend
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
