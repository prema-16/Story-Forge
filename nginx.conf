events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── FRONTEND (storyforge.ai / www.storyforge.ai) ──────────────────────────
    server {
        listen 80;
        server_name storyforge.ai www.storyforge.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── BACKEND API (api.storyforge.ai) ──────────────────────────────────────
    server {
        listen 80;
        server_name api.storyforge.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # ─── TELEMETRY DASHBOARD (status.storyforge.ai) ───────────────────────────
    server {
        listen 80;
        server_name status.storyforge.ai;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─── OPENAPI DOCS (docs.storyforge.ai) ───────────────────────────────────
    server {
        listen 80;
        server_name docs.storyforge.ai;

        location / {
            proxy_pass http://backend:5000/api/docs;
            proxy_set_header Host $host;
        }
    }

    # ─── BILLING PORTAL (billing.storyforge.ai) ──────────────────────────────
    server {
        listen 80;
        server_name billing.storyforge.ai;

        location / {
            proxy_pass http://backend:5000/api/billing;
            proxy_set_header Host $host;
        }
    }
}
