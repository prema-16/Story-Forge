name: StoryForge AI — SaaS Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: 1. Lint, TypeCheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck Backend
        run: pnpm --filter storyforge-backend typecheck

      - name: TypeCheck Frontend
        run: pnpm --filter frontend typecheck

      - name: Security Dependency Audit
        run: pnpm audit --audit-level high

  test-suite:
    name: 2. Automated Test Suites (Jest & Vitest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Tests
        run: cd backend && npx jest --passWithNoTests

      - name: Run Frontend Vitest
        run: cd frontend && npx vitest run

  docker-build-and-deploy:
    name: 3. Docker Multi-Arch Build & Canary Deployment
    runs-on: ubuntu-latest
    needs: test-suite
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: storyforge/backend:latest,storyforge/backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: storyforge/frontend:latest,storyforge/frontend:${{ github.sha }}

      - name: Trigger Blue-Green Canary Deployment
        run: |
          echo "🚀 Deploying commit ${{ github.sha }} to Production Cluster..."
          # SSH or Webhook trigger to production server
